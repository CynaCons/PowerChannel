name: Publish

# Push a tag like v0.5.0 to publish that version to PyPI and the MCP Registry.
# PyPI uses trusted publishing (no token): the pypi.org project lists this repository,
# workflow and the "pypi" environment as a trusted publisher. The MCP Registry uses GitHub OIDC.
# Run it by hand (workflow_dispatch) to publish only server.json to the MCP Registry, for
# example after a registry-side failure.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the package and server.json versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('powerchannel/__init__.py').read()).group(1))")
          srv=$(python -c "import json; d=json.load(open('server.json')); print(d['version'], d['packages'][0]['version'])")
          echo "tag=$tag package=$pkg server.json=$srv"
          test "$tag" = "$pkg" && test "$srv" = "$tag $tag"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  mcp-registry:
    needs: pypi
    if: always() && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sfL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.13/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait for the PyPI release to be visible
        run: |
          version=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/powerchannel/$version/json" > /dev/null && exit 0
            sleep 10
          done
          echo "powerchannel $version not on PyPI after 5 minutes" && exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
