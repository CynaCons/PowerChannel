name: Publish

# Push a tag like v0.5.0 to publish that version to PyPI and the MCP Registry.
# PyPI uses trusted publishing (no token): the project must list this repository and
# workflow as a trusted publisher on pypi.org. The MCP Registry uses GitHub OIDC.

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    # Matches a PyPI trusted publisher set to environment "pypi", and also one with no
    # environment (PyPI then accepts any).
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the package and server.json versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('powerchannel/__init__.py').read()).group(1))")
          srv=$(python -c "import json; d=json.load(open('server.json')); print(d['version'], d['packages'][0]['version'])")
          echo "tag=$tag package=$pkg server.json=$srv"
          test "$tag" = "$pkg" && test "$srv" = "$tag $tag"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait for the PyPI release to be visible
        run: |
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/powerchannel/${GITHUB_REF_NAME#v}/json" > /dev/null && exit 0
            sleep 10
          done
          echo "powerchannel ${GITHUB_REF_NAME#v} not on PyPI after 5 minutes" && exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
